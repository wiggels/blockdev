name: Benchmarks

# two different jobs of work depending on the event:
#
# * pull requests: regression gate. github hosted runners vary 2-3x between
#   machines, so comparing a pr against the last main run is noise. instead
#   bench the merge base and the head back to back on the same runner and
#   fail if a deterministic bench -- the walk and filters groups over fake
#   sysroots -- is more than 25% slower. criterion's --baseline does the
#   comparison, .github/scripts/criterion-gate.py reads the verdict
#
# * pushes to main: history. run everything including the live group and
#   append to /dev/bench/ on gh-pages via github-action-benchmark. no
#   alerting there -- cross run numbers are for the trend line, not a gate
#
# ## one time setup
#
# 1. gh-pages exists as an orphan branch -- the bootstrap step below makes
#    one if not
# 2. settings -> pages -> source gh-pages
# 3. settings -> actions -> general -> workflow permissions -> read and write
#    so GITHUB_TOKEN can push gh-pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  deployments: write

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Run criterion benches + regression check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # merge base needs history
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # rust-cache restores target/ but prunes criterion's sample files, so
      # a restored baseline dir with no data makes criterion print errors
      # into stdout mid line. start clean every run
      - name: Drop stale criterion state
        run: rm -rf target/criterion

      # ---------------------------------------------------------------
      # pull request: same runner a/b against the merge base
      # ---------------------------------------------------------------
      - name: Bench merge base on this runner
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          echo "merge base: $base"
          git worktree add --detach /tmp/base "$base"
          # shared target dir so the saved baseline is where the head run looks
          cd /tmp/base
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            cargo bench --bench devices -- walk filters --save-baseline base

      - name: Bench head and gate against base
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          cargo bench --bench devices -- walk filters --baseline base 2>&1 \
            | tee ab.txt \
            | python3 .github/scripts/criterion-gate.py 25

      # ---------------------------------------------------------------
      # push to main: record history
      # ---------------------------------------------------------------
      - name: Bootstrap gh-pages branch (first run only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages already exists -- nothing to bootstrap."
            exit 0
          fi
          echo "gh-pages not found -- creating empty orphan branch."
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmpdir="$(mktemp -d)"
          git worktree add --detach "$tmpdir"
          (
            cd "$tmpdir"
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            git commit --allow-empty -m "gh-pages: empty root for benchmark history"
            git push origin gh-pages
          )
          git worktree remove --force "$tmpdir"

      - name: Run benchmarks for history
        if: github.event_name == 'push'
        # bencher format emits the `test ... bench:` lines the action reads
        run: cargo bench --bench devices -- --output-format bencher | tee output.txt

      - name: Store result on gh-pages
        if: github.event_name == 'push'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # history only -- the same runner a/b above is the gate. cross run
          # comparisons swing 2-3x with runner hardware and would only alert
          # on noise
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
