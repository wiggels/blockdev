name: Coverage

# lcov via cargo-llvm-cov, uploaded to codecov. prs + main pushes so the
# trend stays current and prs get a coverage delta
#
# ## one time setup
#
# 1. sign in at https://codecov.io and enable this repo
# 2. public repos do not need a token -- private ones want CODECOV_TOKEN

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    name: cargo-llvm-cov
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage report
        # perf_budgets.rs is excluded from the report and its tests are
        # skipped -- they assert wall clock budgets that llvm-cov
        # instrumentation can blow on shared runners. every test in that
        # file has _under_ in its name, nothing else does
        run: |
          cargo llvm-cov --workspace --all-features --locked \
            --ignore-filename-regex 'tests/perf_budgets\.rs' \
            --lcov --output-path lcov.info \
            -- --skip _under_
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
