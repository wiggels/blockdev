[package]
name = "blockdev"
version = "0.4.2"
authors = ["Hunter Wigelsworth <wiggels@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = "A Rust library for parsing and working with lsblk JSON output, providing type-safe block device representation and utilities for Linux"
license = "MIT"
repository = "https://github.com/wiggels/blockdev"
homepage = "https://github.com/wiggels/blockdev"
documentation = "https://docs.rs/blockdev"
readme = "README.md"
keywords = ["block", "lsblk", "linux", "device"]
categories = ["parsing"]

[dependencies]
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
thiserror = "2.0"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
insta = { version = "1.40", features = ["json"] }

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "e2e"
harness = false

[profile.bench]
lto = "thin"
codegen-units = 1
