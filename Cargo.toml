[package]
name = "blockdev"
version = "0.6.2"
authors = ["Hunter Wigelsworth <wiggels@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = "Enumerate Linux block devices straight from /sys and /proc, no lsblk process, no parsing"
license = "MIT"
repository = "https://github.com/wiggels/blockdev"
homepage = "https://github.com/wiggels/blockdev"
documentation = "https://docs.rs/blockdev"
readme = "README.md"
keywords = ["block", "lsblk", "linux", "device", "sysfs"]
categories = ["os::linux-apis", "filesystem"]

[dependencies]
# optional -- Serialize/Deserialize derives on every type, off by default
serde = { version = "1.0.218", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
insta = { version = "1.40", features = ["json"] }
# only for the ignored live test that diffs the walk against real lsblk output
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"

[[bench]]
name = "devices"
harness = false

[profile.bench]
lto = "thin"
codegen-units = 1
